name: Feature request
description: Suggest something rigPlay (tablet app or SimHub plugin) should do.
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 'What are you trying to do on the rig, and what gets in the way today?'
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: 'What should happen instead? Sketches or screenshots welcome.'
    validations: {required: true}
  - type: dropdown
    id: area
    attributes:
      label: Part of rigPlay
      multiple: true
      options: [Tablet app, SimHub plugin, PC ↔ tablet protocol, Docs, Not sure]
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: 'Anything you tried or considered.'
